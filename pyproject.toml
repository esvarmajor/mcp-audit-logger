[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-audit-logger"
version = "0.2.0"
description = "A transparent middleware MCP proxy that audits every tool call to a local SQLite database."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "mcp-audit-logger contributors" },
]
keywords = ["mcp", "model-context-protocol", "audit", "logging", "proxy", "middleware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
]
dependencies = [
    "mcp>=1.6.0",  # requires decorator-based handler API on lowlevel.Server
    "anyio>=4.5",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
mcp-audit-logger = "mcp_audit_logger.__main__:main"

[project.urls]
Homepage = "https://github.com/esvarmajor/mcp-audit-logger"
Issues = "https://github.com/esvarmajor/mcp-audit-logger/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_audit_logger"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
